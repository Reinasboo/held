[package]
name = "held"
version = "0.1.0"
description = "Refundable event commitments on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "held"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token"] }
